server {
    listen 80;
    listen [::]:80;
    server_name lips.maki3991.xyz;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/move-your-lips/acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lips.maki3991.xyz;
    ssl_certificate /etc/letsencrypt/live/lips.maki3991.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lips.maki3991.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /var/log/nginx/move-your-lips.error.log warn;
    server_tokens off;
    client_max_body_size 10000000;
    client_body_timeout 30s;
    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite client-supplied forwarding headers. Only loopback is trusted by API.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 190s;
        proxy_read_timeout 190s;
    }
}
