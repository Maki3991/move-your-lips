<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f8f7" />
    <link rel="icon" type="image/svg+xml" href="/assets/lips.svg" />
    <title>Move Your Lips · 唇语识别</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="brand">
          <img src="/assets/lips.svg" alt="" />Move Your Lips
        </div>
        <div class="status-group">
          <span id="status" class="badge">连接中</span>
          <span id="offline-hint" class="offline-hint" hidden>后端模型已下线，暂不可用，请等待后端电脑启动模型。</span>
        </div>
      </header>
      <main>
        <section class="capture" aria-labelledby="title">
          <h1 id="title">唇语识别</h1>
          <div id="camera" class="camera">
            <video id="video" playsinline muted hidden></video>
            <div id="camera-placeholder" class="camera-placeholder">
              <img src="/assets/camera.svg" alt="" /><strong>前置摄像头</strong
              ><span>开启后可预览画面</span>
            </div>
            <span id="timer" class="timer" hidden></span>
          </div>
          <div id="actions" class="actions"></div>
          <div id="notice" class="notice" role="status" hidden></div>
          <div id="task" class="task-card" aria-live="polite" hidden></div>
          <p class="privacy">
            仅录视频，不采集声音。完整脸部视频将用于识别，处理后自动删除。
          </p>
        </section>
        <section class="history" aria-labelledby="history-title">
          <div class="section-heading">
            <h2 id="history-title">本机记录</h2>
            <button id="clear" class="text-button danger" hidden>
              清空本机识别记录
            </button>
          </div>
          <div id="history-list"></div>
          <p id="storage-note" class="small" hidden></p>
        </section>
      </main>
      <footer>实验模型 · 识别文字可能不准确</footer>
    </div>
    <dialog id="clear-dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title">清空本机识别记录？</h2>
      <p>删除当前浏览器中的编号和结果，无法恢复。</p>
      <p class="small">服务端临时数据仍会自动清理。</p>
      <div class="actions">
        <button id="cancel-clear" autofocus>取消</button
        ><button id="confirm-clear" class="destructive">清空记录</button>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
